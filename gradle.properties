org.gradle.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official

# The build runs on JDK 21 (newer JDKs trip the Kotlin plugin's version parser), selected
# abstractly: gradle/gradle-daemon-jvm.properties pins the daemon's JVM by version and Gradle
# auto-detects an installed JDK 21. Never put org.gradle.java.home here — it is an absolute
# machine-specific path, breaks every other clone, and does not belong in a repository.

# AGP 9 ships its own Kotlin support and a new DSL, and refuses to sit beside the Kotlin
# Multiplatform plugin until the module moves to com.android.kotlin.multiplatform.library. These
# are AGP's own sanctioned bridge until that migration happens. Kept in step with Calendite-KMP,
# which builds this repo as an included build: a composite build permits exactly one AGP version.
android.builtInKotlin=false
android.newDsl=false
