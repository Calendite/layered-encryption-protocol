# Static analysis (LEP-08h): CodeQL over the Kotlin sources, on every PR and weekly against main
# so newly published queries re-scan old code.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 2" # weekly, Tuesday

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: "/language:java-kotlin"
