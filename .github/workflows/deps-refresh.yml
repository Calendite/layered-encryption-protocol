# The auto-update pipeline (LEP-08h): bump the version catalog to the latest stable releases,
# regenerate the dependency-verification metadata (any bump fails the build until its hash is
# re-pinned), run the complete test suite against the fresh versions, and open a pull request
# only when everything passed — the PR arrives green or not at all.
#
# The PR is marked `automerge-candidate` only when the diff touches no cryptographic or toolchain
# dependency. BouncyCastle is the cryptographic core: a compromised release that still passes the
# KATs is exactly the supply-chain case a human must look at, so it never auto-merges — the
# reviewer's surface is the verification-metadata hash diff in the PR.
#
# Note on tokens: PRs created with the default GITHUB_TOKEN do not trigger the ci workflow (GitHub
# suppresses recursive runs). The full suite has already run here, but branch protection that
# requires ci checks will hold the PR; provide a fine-grained PAT as the DEPS_REFRESH_TOKEN secret
# to let ci run on these PRs and auto-merge to work.
name: deps-refresh

on:
  schedule:
    - cron: "0 6 * * 1" # Monday mornings
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Update the version catalog to the latest stable releases
        run: ./gradlew versionCatalogUpdate --console=plain

      - name: Re-pin the verification metadata for the new versions
        run: ./gradlew --write-verification-metadata sha256 help --console=plain

      - name: Anything to propose?
        id: changes
        run: |
          if git diff --quiet -- gradle/libs.versions.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Point Karma at the runner's Chrome
        if: steps.changes.outputs.changed == 'true'
        run: echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"

      - name: Run the full suite against the fresh versions
        if: steps.changes.outputs.changed == 'true'
        run: ./gradlew :lep:jvmTest :lep:testDebugUnitTest :lep:wasmJsBrowserTest :fuzz:test --console=plain

      - name: Classify the update
        if: steps.changes.outputs.changed == 'true'
        id: classify
        run: |
          # Crypto and toolchain bumps need human eyes; everything else may auto-merge when green.
          if git diff -- gradle/libs.versions.toml | grep -E '^[+-](bouncycastle|kotlin|agp) ' ; then
            echo "labels=dependencies,needs-crypto-review" >> "$GITHUB_OUTPUT"
          else
            echo "labels=dependencies,automerge-candidate" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.DEPS_REFRESH_TOKEN || github.token }}
          branch: deps/refresh
          commit-message: |
            Refresh dependencies to the latest stable releases

            Catalog updated by versionCatalogUpdate, verification metadata
            re-pinned, and the full suite run green against the result before
            this PR was opened.
          title: "Refresh dependencies to the latest stable releases"
          labels: ${{ steps.classify.outputs.labels }}
          body: |
            Automated weekly dependency refresh. The full test suite (JVM, Android, Wasm
            browser, fuzz regression) ran green against these versions before this PR was
            opened.

            **Review surface:** the `gradle/verification-metadata.xml` diff is the
            supply-chain check — every new artifact's SHA-256, as served by the repositories
            today. A `needs-crypto-review` label means BouncyCastle or the toolchain moved
            and a human must look before merging.
