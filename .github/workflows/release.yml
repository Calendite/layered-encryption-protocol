# The release gate (LEP-08h): a release is a deliberate act — a version tag or a manual trigger —
# and nothing releases without the complete suite, a real fuzz pass, and the iOS compile all
# green against the exact tagged commit. Artifacts are built once, by this workflow, and attached
# to the GitHub Release. Maven publishing slots in here when the app stops consuming the library
# as a composite build.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Full suite plus fuzz campaign
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out kmp-diagnostics (composite build dependency)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Calendite/kmp-diagnostics
          path: kmp-diagnostics
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Point Karma at the runner's Chrome
        run: echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"
      - name: Run the suite
        run: ./gradlew :lep:jvmTest :lep:testDebugUnitTest :lep:wasmJsBrowserTest --console=plain
      - name: Run the fuzz targets as a campaign, not a replay
        env:
          JAZZER_FUZZ: "1"
        run: ./gradlew :fuzz:test --rerun-tasks --console=plain

  verify-ios:
    name: iOS compiles
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out kmp-diagnostics (composite build dependency)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Calendite/kmp-diagnostics
          path: kmp-diagnostics
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew :lep:compileKotlinIosArm64 --console=plain

  publish:
    name: Build artifacts and publish the release
    needs: [verify, verify-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out kmp-diagnostics (composite build dependency)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Calendite/kmp-diagnostics
          path: kmp-diagnostics
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build the library artifacts
        run: ./gradlew :lep:assemble --console=plain
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="manual-$(date -u +%Y%m%d-%H%M%S)"
            git tag "$TAG" && git push origin "$TAG"
          fi
          gh release create "$TAG" \
            --generate-notes \
            --title "layered-encryption-protocol $TAG" \
            lep/build/libs/*.jar \
            lep/build/outputs/aar/*.aar
