# The nightly fuzz campaign (LEP-08h): the same Jazzer targets that run as quick regression
# replays in ci run here as real coverage-guided fuzzing (JAZZER_FUZZ=1, each target up to its
# @FuzzTest budget). A finding uploads its crashing inputs and opens an issue — a fuzz crash in a
# parser is a security bug until proven otherwise.
name: fuzz-campaign

on:
  schedule:
    - cron: "0 2 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out kmp-diagnostics (composite build dependency)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Calendite/kmp-diagnostics
          path: kmp-diagnostics
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run the campaign
        id: campaign
        env:
          JAZZER_FUZZ: "1"
        run: ./gradlew :fuzz:test --rerun-tasks --console=plain

      - name: Upload crashing inputs and reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-findings-${{ github.run_id }}
          path: |
            fuzz/build/reports/tests/
            fuzz/**/crash-*
            fuzz/**/*.cifuzz-corpus/

      - name: Open an issue for the finding
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Nightly fuzz campaign found a crash ($(date -u +%F))" \
            --label security,fuzzing \
            --body "The nightly Jazzer campaign failed. Crashing inputs and reports are attached to the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Treat a parser crash as a security bug until proven otherwise."
